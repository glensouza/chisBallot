<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chisBallot</title>
  <style>
    :root { --blue: #1b4f9c; --tint: #eef2f7; --ink: #1b1f24; }
    body { margin: 0; font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--ink); }
    header { background: var(--blue); color: #fff; padding: 1rem 1.25rem; }
    main { max-width: 40rem; margin: 2rem auto; padding: 0 1.25rem; }
    h1, h2 { color: var(--blue); }
    header h1 { color: #fff; margin: 0; }
    .brand { display: inline-flex; align-items: center; gap: 0.75rem; text-decoration: none; }
    .brand img { height: 2.4rem; width: auto; background: #fff; border-radius: 999px; padding: 0.25rem 0.6rem; box-sizing: content-box; }
    .card { background: var(--tint); border-radius: 10px; padding: 1.25rem; }
  </style>
</head>
<body>
  <header><a class="brand" href="/"><img src="logo.png" alt="Citrus Hills Intermediate School jaguar" width="360" height="214"><h1>chisBallot</h1></a></header>
  <main>
    <p>A small open source voting site for the Citrus Hills Intermediate School council board.</p>
    <div class="card">
      <h2>Voting?</h2>
      <p>You need the QR code on your paper slip. Scan it with your phone to open your ballot.</p>
    </div>
    <p><a href="https://github.com/glensouza/chisBallot">Source code and documentation</a></p>
  </main>
</body>
</html>
