name: Infrastructure

on:
  pull_request:
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  push:
    branches: [main]
    paths:
      - "infra/**"
      - ".github/workflows/infra.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

concurrency:
  group: infrastructure
  cancel-in-progress: false

env:
  ARM_USE_OIDC: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
  TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
  TF_VAR_cloudflare_zone_id: ${{ vars.CLOUDFLARE_ZONE_ID }}
  TF_VAR_cloudflare_account_id: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
  TF_IN_AUTOMATION: "true"

defaults:
  run:
    working-directory: infra

jobs:
  plan:
    name: Plan
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Format check
        run: terraform fmt -check -recursive

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.AZURE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=chisballot.tfstate"

      - name: Validate
        run: terraform validate

      - name: Plan
        run: |
          terraform plan -input=false -no-color -out=tfplan
          terraform show -no-color tfplan > plan.txt

      - name: Post plan to the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          {
            echo "### Terraform plan"
            echo
            echo '```'
            head -c 60000 plan.txt
            echo
            echo '```'
          } > comment.md
          gh pr comment "$PR_NUMBER" --body-file comment.md --edit-last --create-if-none

  apply:
    name: Apply
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false

      - name: Init
        run: >
          terraform init -input=false
          -backend-config="resource_group_name=${{ vars.AZURE_RESOURCE_GROUP }}"
          -backend-config="storage_account_name=${{ vars.TF_STATE_ACCOUNT }}"
          -backend-config="container_name=tfstate"
          -backend-config="key=chisballot.tfstate"

      - name: Apply
        run: terraform apply -input=false -auto-approve
