name: Build, test and deploy

# One workflow for the whole path from a change to the running sites.
#
#   every pull request and every push to main:   build and test
#   push to main that changes the sites or ops:   then deploy, after the tests pass
#
# The tests run on the server's pull-request runner, inside a container (the
# .NET SDK image) next to a throwaway PostgreSQL container, as the runner's
# unprivileged user with rootless Docker.
#
# The sites are compiled once. On main, the test job publishes what it just built
# and tested into one compressed bundle (a workflow artifact, kept one day and
# deleted after a successful deploy). The deploy job on the production runner only
# downloads that bundle, checks its checksum and puts it into service with the
# deploy script in ops/lxc (which also updates the server's scripts from this
# commit); it never compiles, so the server needs no SDK. It waits
# for a reviewer's approval in the "production" environment, and only main can
# deploy to it. Pull requests never reach the production runner.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# A newer push to a pull request replaces its older run. A run on main is never
# cancelled half way, so a deploy is not interrupted.
concurrency:
  group: build-and-deploy-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: Build and test
    runs-on: [self-hosted, pr]
    container:
      image: mcr.microsoft.com/dotnet/sdk:11.0
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
        # The data lives in memory, so nothing is left on disk when the job ends
        # (the image's data folder would otherwise leave a volume behind each run).
        options: >-
          --tmpfs /var/lib/postgresql/data
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      CHISBALLOT_TEST_POSTGRES: Host=postgres;Username=postgres;Password=test-only
    outputs:
      bundle_sha256: ${{ steps.bundle.outputs.sha256 }}
      bundle_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Restore
        run: dotnet restore

      # The rules in .editorconfig: explicit types, this., namespace first, braces, no unused usings.
      - name: Code style
        run: dotnet format style --verify-no-changes --severity warn --no-restore

      - name: Build
        run: dotnet build --no-restore --configuration Release -p:SourceRevisionId="$GITHUB_SHA"

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Dev-only admin sign-in is not in the release build
        run: |
          dlls=$(find src/ChisBallot.Admin/bin/Release -name ChisBallot.Admin.dll)
          test -n "$dlls" || { echo "Release build of the admin site was not found"; exit 1; }
          for dll in $dlls; do
            # The marker is stored as UTF-16, so letters are separated by NUL bytes.
            if perl -0777 -ne 'exit(index($_, join("\0", split(//, "CHISBALLOT_DEV_ADMIN"))) >= 0 ? 0 : 1)' "$dll"; then
              echo "$dll contains the dev admin bypass"
              exit 1
            fi
            echo "ok: $dll"
          done

      # Only a change to the sites or the server setup needs a deploy. A run
      # started by hand always deploys.
      - name: Does this change need a deploy
        id: changes
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "push" ] && git diff --name-only HEAD~1 HEAD | grep -qE '^(src/|ops/|global\.json$|Directory\.Build\.props$|\.github/workflows/build-and-deploy\.yml$)'; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      # The one compile: publish from the build that was just tested, without
      # building again, and keep it as a single file for the deploy job.
      - name: Publish the sites once, for the deploy
        id: bundle
        if: steps.changes.outputs.deploy == 'true' && github.event_name != 'pull_request'
        run: |
          rm -rf release chisballot-release.tgz
          dotnet publish src/ChisBallot.Vote.Server --configuration Release --no-build --output release/vote
          dotnet publish src/ChisBallot.Admin --configuration Release --no-build --output release/admin
          dotnet publish src/ChisBallot.Migrator --configuration Release --no-build --output release/migrator
          tar -C release -czf chisballot-release.tgz vote admin migrator
          echo "sha256=$(sha256sum chisballot-release.tgz | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"

      - name: Keep the bundle until it is deployed
        id: upload
        if: steps.bundle.outputs.sha256 != ''
        uses: actions/upload-artifact@v7
        with:
          name: release
          path: chisballot-release.tgz
          retention-days: 1
          compression-level: 0
          if-no-files-found: error

  deploy:
    name: Deploy to the server
    needs: test
    if: >-
      github.repository == 'glensouza/chisBallot'
      && github.ref == 'refs/heads/main'
      && github.event_name != 'pull_request'
      && needs.test.outputs.bundle_sha256 != ''
    runs-on: [self-hosted, prod]
    environment: production
    permissions:
      contents: read
      actions: write
    steps:
      # Only the server's own scripts, from this commit, so the deploy can update
      # them (see ops/lxc/chisballot-deploy). No source is built here.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: ops/lxc
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: release
          path: ${{ runner.temp }}/bundle

      - name: Check the bundle and unpack it
        run: |
          cd "$RUNNER_TEMP/bundle"
          echo "${{ needs.test.outputs.bundle_sha256 }}  chisballot-release.tgz" | sha256sum -c -
          rm -rf "$RUNNER_TEMP/release"
          mkdir "$RUNNER_TEMP/release"
          tar -xzf chisballot-release.tgz -C "$RUNNER_TEMP/release" --no-same-owner

      - name: Deploy
        run: sudo /usr/local/sbin/chisballot-deploy "$RUNNER_TEMP/release" "$GITHUB_WORKSPACE/ops/lxc"

      # Not needed any more once it is in service. If the deploy failed it stays
      # (for a day) so the job can be run again.
      - name: Delete the bundle
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json"             "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/artifacts/${{ needs.test.outputs.bundle_id }}"
          rm -rf "$RUNNER_TEMP/bundle" "$RUNNER_TEMP/release"
