name: App

on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/app.yml"

permissions:
  contents: read

concurrency:
  group: app-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Test
        run: dotnet test --no-build --configuration Release

      - name: Dev-only admin sign-in is not in the release build
        run: |
          python3 - <<'PY'
          import glob
          marker = "CHISBALLOT_DEV_ADMIN".encode("utf-16-le")
          dlls = glob.glob("src/ChisBallot.Admin/bin/Release/**/ChisBallot.Admin.dll", recursive=True)
          assert dlls, "Release build of the admin site was not found"
          for dll in dlls:
              assert marker not in open(dll, "rb").read(), dll + " contains the dev admin bypass"
          print("ok:", dlls)
          PY
